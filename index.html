<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechnoVIT — CodeChef VIT Chennai</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="welcome-body">

  <div class="grid-bg"></div>
  <div class="scanlines"></div>

  <main class="welcome-wrap">
    <div class="badge-float">
      <img src="images/codechef.png" alt="CodeChef VIT Chennai" class="welcome-logo" />
    </div>

    <p class="kicker glow-cyan">CODECHEF &lt;VIT CHENNAI&gt; CHAPTER</p>

    <h1 class="welcome-title">
      <span class="word" style="--d:0s">EXCITED</span>
      <span class="word" style="--d:.15s">FOR</span>
      <span class="word neon" style="--d:.3s">TECHNOVIT?</span>
    </h1>

    <p class="welcome-sub">
      Find out what events we have lined up for y'all —
      <br />solve the puzzles to reveal each one.
    </p>

    <div class="event-chips">
      <span class="chip" style="--d:.5s">CODE-O-FIESTA</span>
      <span class="chip" style="--d:.65s">INNOVATION UNBOUND</span>
      
    </div>

    <button class="start-btn" onclick="window.location.href='game.html'">
      PROCEED TO PUZZLES
      <span class="arrow">&rarr;</span>
    </button>

    <p class="hint-line">2 puzzles &nbsp;•&nbsp; 3 min 30s each &nbsp;•&nbsp; reference shown on the right</p>
  </main>

</body>
</html>
